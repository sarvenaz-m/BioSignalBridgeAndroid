name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android, exports and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719' # 16.0; compatible with JDK 17
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK packages
        run: |
          command -v sdkmanager
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test and build Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :core:signal:test \
            :core:storage:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assemblePreview \
            :app:lintDebug

      - name: Check Python recording interoperability
        run: python -m unittest discover -s analysis -p 'test_*.py' -v

      - name: Restore browser dependencies
        run: npm ci

      - name: Test the packet model
        run: npm test

      - name: Build the offline demo
        run: npm run build:demo

      - name: Prepare Chromium
        run: npx playwright install --with-deps chromium

      - name: Check browser journeys and accessibility
        run: npm run test:browser
